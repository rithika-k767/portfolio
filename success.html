<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message Sent</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#08121f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Poppins',sans-serif;
}

.card{
    width:480px;
    background:#101b2d;
    border:1px solid rgba(0,217,255,.3);
    border-radius:20px;
    padding:50px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,217,255,.25);
}

.check{
    font-size:80px;
    margin-bottom:20px;
}

.card h2{
    color:#ffffff;
    font-size:36px;
    font-weight:700;
    margin-bottom:15px;
}

.card p{
    color:#c9d1d9;
    font-size:18px;
    line-height:30px;
}

.btn-home{
    display:inline-block;
    margin-top:35px;
    padding:15px 40px;
    background:#00D9FF;
    color:#08121f;
    text-decoration:none;
    border-radius:12px;
    font-size:18px;
    font-weight:700;
    transition:.3s;
    box-shadow:0 0 20px rgba(0,217,255,.45);
}

.btn-home:hover{
    background:#ffffff;
    color:#08121f;
    transform:translateY(-5px);
}

</style>

</head>

<body>

<div class="card">

<div class="check">✅</div>

<h2>Message Sent Successfully!</h2>

<p>
Thank you for contacting me.<br>
I'll get back to you as soon as possible.
</p>

<a href="index.html" class="btn-home">
Back to Portfolio
</a>

</div>

</body>

</html>
